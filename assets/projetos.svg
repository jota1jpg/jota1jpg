<svg width="860" height="300" viewBox="0 0 860 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Port Scanner - Projeto de João</title>
  <desc id="desc">Scanner de portas TCP desenvolvido em Python.</desc>

  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="860" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#101713"/>
      <stop offset="0.5" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#101A13"/>
    </linearGradient>

    <linearGradient id="border" x1="80" y1="20" x2="780" y2="280" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4ade80">
        <animate attributeName="stop-color" values="#4ade80;#16a34a;#4ade80" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#166534">
        <animate attributeName="stop-color" values="#166534;#4ade80;#166534" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(700 230) rotate(-145) scale(330 270)">
      <stop stop-color="#22c55e" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>

    <filter id="shadow" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0L0 0 0 28" fill="none" stroke="#4ade80" stroke-opacity="0.045"/>
    </pattern>
  </defs>

  <style>
    .mono { font-family: "JetBrains Mono", "Fira Code", Consolas, monospace; }
    .line { opacity: 0; animation: reveal 12s ease-in-out infinite; }
    .l1 { animation-delay: .3s; }
    .l2 { animation-delay: 1.1s; }
    .l3 { animation-delay: 2s; }
    .l4 { animation-delay: 2.8s; }
    .cursor { animation: blink .9s steps(1) infinite; }
    .status { animation: pulse 2.2s ease-in-out infinite; }

    @keyframes reveal {
      0%, 5% { opacity: 0; transform: translateY(5px); }
      10%, 88% { opacity: 1; transform: translateY(0); }
      94%, 100% { opacity: 0; }
    }

    @keyframes blink {
      0%, 48% { opacity: 1; }
      49%, 100% { opacity: 0; }
    }

    @keyframes pulse {
      0%, 100% { opacity: .5; }
      50% { opacity: 1; }
    }
  </style>

  <!-- Background -->
  <rect width="860" height="300" rx="26" fill="#080B09"/>
  <rect width="860" height="300" rx="26" fill="url(#grid)"/>
  <rect width="860" height="300" rx="26" fill="url(#glow)"/>

  <!-- Rounded terminal panel -->
  <g filter="url(#shadow)">
    <rect x="28" y="20" width="804" height="260" rx="22" fill="url(#panel)"/>
    <rect x="28.75" y="20.75" width="802.5" height="258.5" rx="21.25" stroke="url(#border)" stroke-width="1.5"/>
  </g>

  <!-- Project information -->
  <g class="mono">
    <g class="line l1">
      <text x="60" y="65" font-size="15" fill="#4ade80">~/projetos</text>
      <text x="60" y="112" font-size="16" fill="#4ade80">❯</text>
      <text x="86" y="112" font-size="21" font-weight="bold" fill="#E6EDF3">Port Scanner</text>
    </g>

    <g class="line l2">
      <text x="60" y="150" font-size="14" fill="#9CA3AF">Scanner de portas TCP desenvolvido em Python.</text>
    </g>

    <g class="line l3">
      <rect x="60" y="178" width="100" height="29" rx="7" fill="#123D28" stroke="#4ade80" stroke-opacity=".45"/>
      <text x="110" y="197" text-anchor="middle" font-size="12" fill="#4ade80">Python</text>
    </g>

    <g class="line l4">
      <text x="60" y="245" font-size="12" fill="#6B8071">github.com/jota1jpg/Port-Scanner-Basic-py</text>
    </g>
  </g>

  <!-- Clickable project link -->
  <a href="https://github.com/jota1jpg/Port-Scanner-Basic-py">
    <rect x="650" y="218" width="145" height="38" rx="9" fill="#123D28" stroke="#4ade80" stroke-opacity=".6"/>
    <text x="722.5" y="242" text-anchor="middle" class="mono" font-size="12" fill="#4ade80">Ver projeto →</text>
  </a>

  <!-- Online status -->
  <g class="status">
    <circle cx="785" cy="54" r="5" fill="#4ade80"/>
    <text x="770" y="58" text-anchor="end" class="mono" font-size="11" fill="#84918A">online</text>
  </g>
</svg>
